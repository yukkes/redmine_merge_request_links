# Keep compatible with the oldest supported Redmine (5.0: Ruby 2.5, Rails 6.1).
plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  TargetRubyVersion: 2.5
  TargetRailsVersion: 6.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'evidence/**/*'
    - 'vendor/**/*'

# Redmine 5.0 has no ApplicationRecord.
Rails/ApplicationRecord:
  Enabled: false

# Changing the existing schema is out of scope for style checks.
Rails/CreateTableWithTimestamps:
  Enabled: false
Rails/HasAndBelongsToMany:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'test/**/*'
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'test/**/*'
